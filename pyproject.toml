[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chessengine-lab"
version = "0.1.0"
description = "An auditable supervised and self-play chess research engine"
requires-python = ">=3.10"
dependencies = ["chess==1.11.2", "numpy>=1.26,<3", "fastapi==0.115.11", "uvicorn==0.34.0", "pydantic>=2.10,<3", "threadpoolctl>=3.5,<4"]

[project.optional-dependencies]
train = ["torch==2.7.0", "zstandard==0.25.0", "certifi>=2025.1.31", "matplotlib>=3.8,<4", "reportlab==4.4.10"]
dev = ["pytest>=7.4,<9", "httpx==0.28.1", "ruff==0.11.13", "pypdfium2==4.30.0"]

[project.scripts]
chesslab = "chessengine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
