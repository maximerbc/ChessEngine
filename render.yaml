services:
  - type: web
    name: chessengine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-runtime.txt && pip install --no-deps .
    startCommand: uvicorn chessengine.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MODEL_MANIFEST
        value: artifacts/models/manifest.json
      - key: ALLOWED_ORIGINS
        sync: false
  - type: web
    name: chessengine-demo
    runtime: static
    buildCommand: cd web && npm ci && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
