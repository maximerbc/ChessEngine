name: Secret scanning
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Verify checksum exception stays narrow
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, secrets, string, subprocess, tempfile
          checkout = pathlib.Path.cwd()
          config = checkout / '.gitleaks.toml'
          scanner = str(pathlib.Path(os.environ['RUNNER_TEMP']) / 'gitleaks')
          paths = [
              'docs/experiments/stockfish-move-policy-1m-20261124/frozen-source.json',
              'web/public/research/stockfish-move-policy-1m-20261124/frozen-source.json',
          ]
          for path in paths:
              for rule, assignment in [
                  ('generic-api-key', 'api_key = "' + secrets.token_urlsafe(32) + '"'),
                  ('github-pat', 'github_token = "ghp_' + ''.join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)) + '"'),
              ]:
                  with tempfile.TemporaryDirectory() as directory:
                      root = pathlib.Path(directory)
                      fixture = root / path
                      fixture.parent.mkdir(parents=True)
                      fixture.write_text((checkout / path).read_text() + '\n' + assignment + '\n')
                      report = root.parent / (root.name + '-report.json')
                      try:
                          result = subprocess.run([scanner, 'dir', '--config', str(config), '--redact', '--no-banner', '--report-format', 'json', '--report-path', str(report), '.'], cwd=root, capture_output=True)
                          findings = json.loads(report.read_text())
                          assert result.returncode == 1 and len(findings) == 1 and findings[0]['RuleID'] == rule, 'Secret scanner exception hid a synthetic credential or allowed the checksum alert'
                      finally:
                          report.unlink(missing_ok=True)
          print('Synthetic credential checks passed for both checksum files')
          PYTHON
      - name: Scan fetched history and tracked artifact contents
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts="--all" .
          audit_dir="$(mktemp -d "$RUNNER_TEMP/chess-audit.XXXXXX")"
          git archive HEAD | tar -x -C "$audit_dir"
          (cd "$audit_dir" && "$RUNNER_TEMP/gitleaks" dir --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact --max-archive-depth 3 .)
